
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Admin Account Settings</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
        }

        .settings-container {
            max-width: 850px;
            margin: 40px auto;
        }

        .settings-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            color: #17365d;
            font-weight: 700;
        }

        .form-control {
            padding: 12px;
        }

        .btn-primary {
            background: #17365d;
            border-color: #17365d;
        }

        .btn-primary:hover {
            background: #102744;
        }
    </style>
</head>

<body>

<div class="container settings-container">

    <h2 class="page-title">Account Settings</h2>

    <p class="text-muted mb-4">
        Manage your Super Admin username and password.
    </p>

    <!-- Notifications -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show"
                 role="alert">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
                </button>

            </div>
        {% endfor %}
    {% endwith %}


    <!-- CHANGE USERNAME -->
    <div class="card settings-card mb-4">

        <div class="card-body p-4">

            <h5 class="mb-3">Change Username</h5>

            <form method="POST"
                  action="{{ url_for('super_admin_account_settings') }}">

                <input
                    type="hidden"
                    name="action"
                    value="change_username"
                >

                <div class="mb-3">
                    <label class="form-label">Current Username</label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ current_user.username }}"
                        readonly
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">New Username</label>

                    <input
                        type="text"
                        class="form-control"
                        name="new_username"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Current Password</label>

                    <input
                        type="password"
                        class="form-control"
                        name="current_password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Username
                </button>

            </form>

        </div>
    </div>


    <!-- CHANGE PASSWORD -->
    <div class="card settings-card mb-4">

        <div class="card-body p-4">

            <h5 class="mb-3">Change Password</h5>

            <form method="POST"
                  action="{{ url_for('super_admin_account_settings') }}">

                <input
                    type="hidden"
                    name="action"
                    value="change_password"
                >

                <div class="mb-3">
                    <label class="form-label">Current Password</label>

                    <input
                        type="password"
                        class="form-control"
                        name="current_password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>

                    <input
                        type="password"
                        class="form-control"
                        name="new_password"
                        minlength="12"
                        autocomplete="new-password"
                        required
                    >

                    <small class="text-muted">
                        Use at least 12 characters.
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>

                    <input
                        type="password"
                        class="form-control"
                        name="confirm_password"
                        minlength="12"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Change Password
                </button>

            </form>

        </div>
    </div>


    <a href="{{ url_for('saas_dashboard') }}"
       class="btn btn-outline-secondary">

        &larr; Back to Dashboard

    </a>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
