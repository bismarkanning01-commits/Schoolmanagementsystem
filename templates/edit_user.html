{% extends 'base.html' %}

{% block content %}

<div class="container py-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="mb-1">Edit Staff Account</h2>
            <p class="text-muted mb-4">{{ user.role|capitalize }}</p>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" type="text" name="username" class="form-control"
                           value="{{ user.username }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" type="email" name="email" class="form-control"
                           value="{{ user.email or '' }}" maxlength="254"
                           autocomplete="email" required>
                </div>

                {% if user.role == 'teacher' %}
                <div class="mb-3">
                    <label for="class_ids" class="form-label">Assigned classes</label>
                    <select id="class_ids" name="class_ids" class="form-select" multiple size="5">
                        {% for classroom in classes %}
                        <option value="{{ classroom.id }}"
                                {% if classroom in user.classes %}selected{% endif %}>
                            {{ classroom.name }}
                        </option>
                        {% endfor %}
                    </select>
                    <div class="form-text">Use Ctrl (Windows) or Command (Mac) to select multiple classes.</div>
                </div>
                {% endif %}

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('manage_staff') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
