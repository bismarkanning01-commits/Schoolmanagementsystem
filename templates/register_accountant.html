{% extends 'base.html' %}

{% block content %}
<!-- YOUR CSS (IMPORTANT FIX) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>💼 Register Accountant</h2>

        <form method="POST">

            <div class="mb-3">

                <label>Username</label>

                <input type="text"
                       name="username"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input id="email"
                       type="email"
                       name="email"
                       class="form-control"
                       maxlength="254"
                       autocomplete="email"
                       required>
            </div>

            <div class="mb-3">

                <label>Password</label>

                <input type="password"
                       name="password"
                       class="form-control"
                       required>

            </div>

            <button class="btn btn-success">
                Register Accountant
            </button>

        </form>

    </div>

</div>

{% endblock %}
