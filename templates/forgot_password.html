<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <main class="p-4 shadow bg-white rounded" style="width: 100%; max-width: 380px;">
        <h1 class="h4 text-center mb-3">Reset your password</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} p-2" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <p class="text-muted">
            Enter your username and the recovery email saved to your account.
        </p>
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username"
                       type="text"
                       name="username"
                       class="form-control"
                       autocomplete="username"
                       required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Recovery email</label>
                <input id="email"
                       type="email"
                       name="email"
                       class="form-control"
                       autocomplete="email"
                       required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">
                Send reset link
            </button>
        </form>
        <a href="{{ url_for('login') }}">Back to login</a>
    </main>
</body>
</html>
