{% extends 'base.html' %}
{% block content %}
<!-- YOUR CSS (IMPORTANT FIX) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<button onclick="history.back()"
        class="btn btn-secondary mb-3">
    ← Back
</button>

<h2>🏫 Class Management</h2>

<!-- ADD CLASS -->
<form method="POST" class="row mb-4">
    <div class="col-md-6">
        <input type="text" name="name" class="form-control" placeholder="Enter class name (e.g. Basic 1)" required>
    </div>
    <div class="col-md-2">
        <button class="btn btn-success">Add Class</button>
    </div>
</form>

<!-- CLASS LIST -->
<div class="card p-3">
    <h5>All Classes</h5>

    <table class="table table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Class Name</th>
                <th>Students</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for c in classes %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ c.name }}</td>
                <td>{{ c.students|length }}</td>
                <td>
                    <a href="{{ url_for('edit_class', id=c.id) }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{{ url_for('delete_class', id=c.id) }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this class?')">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center">No classes found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
