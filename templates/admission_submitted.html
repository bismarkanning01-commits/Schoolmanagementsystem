<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admission Application Submitted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="card shadow-sm mx-auto text-center" style="max-width: 620px;">
      <div class="card-body p-4 p-md-5">
        <div class="text-success display-5 mb-3"><i class="bi bi-check-circle"></i></div>
        <h1 class="h3">Application submitted</h1>
        <p class="text-muted">Keep this student ID for reference. The application is awaiting school approval.</p>
        <div class="alert alert-primary fs-4 fw-bold">{{ application.admission_no }}</div>
        <p class="mb-4">{{ application.school.name }} · {{ application.classroom.name }}</p>
        <a href="{{ url_for('admission_portal') }}" class="btn btn-primary">Submit another application</a>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Home</a>
      </div>
    </div>
  </main>
</body>
</html>
