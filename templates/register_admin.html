{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>Create a School Admin</h2>
        <p class="text-muted">
            Choose a school and create its administrator account.
        </p>

        <form method="POST">

            <div class="mb-3">
                <label for="school_id" class="form-label">School</label>
                <select id="school_id" name="school_id" class="form-select" required>
                    <option value="">Select a school</option>
                    {% for school in schools %}
                    <option value="{{ school.id }}"
                            {% if form.get('school_id', '')|string == school.id|string %}selected{% endif %}>
                        {{ school.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">

                <label for="username" class="form-label">Username</label>

                <input id="username"
                       type="text"
                       name="username"
                       class="form-control"
                       maxlength="100"
                       value="{{ form.get('username', '') }}"
                       autocomplete="username"
                       required>

            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Admin email</label>
                <input id="email"
                       type="email"
                       name="email"
                       class="form-control"
                       maxlength="254"
                       value="{{ form.get('email', '') }}"
                       autocomplete="email"
                       required>
            </div>

            <div class="mb-3">

                <label for="password" class="form-label">Initial password</label>

                <input id="password"
                       type="password"
                       name="password"
                       class="form-control"
                       minlength="8"
                       autocomplete="new-password"
                       required>
                <div class="form-text">Use at least 8 characters and share it securely.</div>

            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-dark" type="submit">Create School Admin</button>
                <a href="{{ url_for('saas_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
