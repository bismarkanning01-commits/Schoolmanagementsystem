{% extends 'base.html' %} 
{% block content %}
<!-- YOUR CSS (IMPORTANT FIX) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<button onclick="history.back()"
        class="btn btn-secondary mb-3">
    ← Back
</button>

<div class="container mt-4">
  <h2>Edit Student</h2>

  <form method="POST" class="card p-4 shadow-sm border-0 rounded-4">
    <!-- Name -->
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input
        type="text"
        name="name"
        value="{{ student.name }}"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="phone">Student Phone</label>
      <input
        type="text"
        id="phone"
        name="phone"
        value="{{ student.phone or '' }}"
        class="form-control"
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="parent_phone">Parent/Guardian Phone</label>
      <input
        type="text"
        id="parent_phone"
        name="parent_phone"
        value="{{ student.parent_phone or '' }}"
        class="form-control"
      />
    </div>

    <!-- Gender -->
    <div class="mb-3">
      <label class="form-label" for="gender">Gender</label>
      <select name="gender" id="gender" class="form-control" required>
        <option value="">-- Select Gender --</option>
        <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
        <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
      </select>
    </div>

    <!-- Class -->
    <div class="mb-3">
      <label class="form-label">Class</label>

      <select name="class_id" class="form-control" required>
        {% for c in classes %}
        <option
            value="{{ c.id }}"
            {%
              if
              c.id==student.class_id
              %}selected{%
              endif
           %}
          >
          {{ c.name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <button class="btn btn-success w-100">Update Student</button>
  </form>
</div>

{% endblock %}
