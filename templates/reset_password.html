<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a New Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <main class="p-4 shadow bg-white rounded" style="width: 100%; max-width: 380px;">
        <h1 class="h4 text-center mb-3">Choose a new password</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} p-2" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="mb-3">
                <label for="new-password" class="form-label">New password</label>
                <input id="new-password"
                       type="password"
                       name="new_password"
                       class="form-control"
                       minlength="12"
                       autocomplete="new-password"
                       required>
                <div class="form-text">Use at least 12 characters.</div>
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">
                    Confirm new password
                </label>
                <input id="confirm-password"
                       type="password"
                       name="confirm_password"
                       class="form-control"
                       minlength="12"
                       autocomplete="new-password"
                       required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                Reset password
            </button>
        </form>
    </main>
</body>
</html>
