{% extends 'base.html' %}
{% block content %}

<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="mb-1">Edit Performance Record</h2>
            <p class="text-muted mb-4">{{ student.name }}</p>

            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="subject" class="form-label">Subject</label>
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            class="form-control"
                            value="{{ performance.subject }}"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <label for="term" class="form-label">Term</label>
                        <select id="term" name="term" class="form-select" required>
                            {% for term_option in ('Term 1', 'Term 2', 'Term 3') %}
                            <option value="{{ term_option }}" {% if performance.term == term_option %}selected{% endif %}>
                                {{ term_option }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="academic_year" class="form-label">Academic Year</label>
                        <input
                            type="text"
                            id="academic_year"
                            name="academic_year"
                            class="form-control"
                            value="{{ performance.academic_year }}"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <label for="class_score" class="form-label">Class Score (0–30)</label>
                        <input
                            type="number"
                            id="class_score"
                            name="class_score"
                            class="form-control"
                            min="0"
                            max="30"
                            step="0.01"
                            value="{{ performance.class_score }}"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <label for="exam_score" class="form-label">Exam Score (0–70)</label>
                        <input
                            type="number"
                            id="exam_score"
                            name="exam_score"
                            class="form-control"
                            min="0"
                            max="70"
                            step="0.01"
                            value="{{ performance.exam_score }}"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Current Total</label>
                        <input
                            type="text"
                            class="form-control"
                            value="{{ performance.total_score }}"
                            readonly
                        >
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('performance', class_id=back_class_id) if back_class_id else url_for('performance') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
